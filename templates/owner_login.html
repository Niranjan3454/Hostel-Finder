<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login - Hostel Finder</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/owner-login.css') }}">
      
</head>

<body>

<div class="form-container">

    <h1>Hostel Owner Login</h1>

    <p>Login to manage your hostel.</p>

    <form method="POST" action="/owner/login">

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="form-links">
        <p>
            Don't have an account?
            <a href="{{ url_for('owner_register') }}">Register</a>
        </p>

        <p>
            Are you looking for a hostel?
            <a href="{{ url_for('hosteller_login') }}">Hosteller Login</a>
        </p>

        <a href="{{ url_for('home') }}">&larr; Back to Home</a>
    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
