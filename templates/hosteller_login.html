<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hosteller Login - Hostel Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/hosteller_login.css') }}">
    
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-2">
                    👤 Hosteller Login
                </h2>

                <p class="text-center text-muted">
                    Login to find your perfect hostel
                </p>


                <form method="POST"
                      action="/login">


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>


                <div class="text-center mt-4">

                    <p>
                        Don't have an account?
                        <a href="/register">
                            Register
                        </a>
                    </p>

                    <p>
                        Are you a hostel owner?
                        <a href="/owner/login">
                            Owner Login
                        </a>
                    </p>

                    <a href="/">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
