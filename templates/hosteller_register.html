<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hosteller Registration - Hostel Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/hosteller-register.css') }}">
      
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="form-container">

                <h1 class="text-center">
                    👤 Hosteller Registration
                </h1>

                <p class="text-center">
                    Create an account to find and save hostels.
                </p>


                <form method="POST"
                      action="/register">


                    <!-- Name -->

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control mb-3"
                        placeholder="Enter your full name"
                        required>


                    <!-- Email -->

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control mb-3"
                        placeholder="Enter your email"
                        required>


                    <!-- Phone -->

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        class="form-control mb-3"
                        placeholder="Enter phone number"
                        pattern="[6-9][0-9]{9}"
                        minlength="10"
                        maxlength="10"
                        inputmode="numeric"
                        title="Enter a valid 10-digit mobile number starting with 6, 7, 8, or 9"
                        required>


                    <!-- Password -->

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control mb-3"
                        placeholder="Create password"
                        required>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Register

                    </button>

                </form>


                <div class="text-center mt-3">

                    <p>
                        Already have an account?
                        <a href="/login">
                            Login here
                        </a>
                    </p>

                    <p>
                        Are you a hostel owner?
                        <a href="/owner/register">
                            Register as Owner
                        </a>
                    </p>

                    <a href="/">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
